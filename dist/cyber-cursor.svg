<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Outer Cyan Neon Aura Layer -->
  <polygon points="1,1 27,12 15,15 12,27" fill="#00f2fe" opacity="0.35"/>
  <!-- Dark Contrast Shadow Border (crisp visibility on light & dark) -->
  <polygon points="2,2 25,11.5 14.5,14.5 11.5,25" fill="#030712" stroke="#00f2fe" stroke-width="1"/>
  <!-- Primary Cyber Blade -->
  <polygon points="3,3 23,11 13.5,13.5 11,23" fill="url(#cyberGrad)"/>
  <!-- Inner White Highlight Facet -->
  <polyline points="5,5 17,10 12,12 10,17" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Hotspot Tip Pip -->
  <circle cx="3" cy="3" r="1.5" fill="#ffffff"/>
</svg>